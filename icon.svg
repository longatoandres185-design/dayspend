<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFE4ED" />
      <stop offset="100%" stop-color="#FCD5E0" />
    </linearGradient>

    <!-- Petal Main Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5281" />
      <stop offset="100%" stop-color="#CF194F" />
    </linearGradient>

    <!-- Petal Secondary Gradient -->
    <linearGradient id="petalLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA1BD" />
      <stop offset="100%" stop-color="#F85987" />
    </linearGradient>

    <!-- Medallion Gradient -->
    <linearGradient id="medallionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF5F7" />
    </linearGradient>

    <!-- Soft Drop Shadow for Flower -->
    <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#D82258" flood-opacity="0.25" />
    </filter>

    <!-- Medallion Shadow -->
    <filter id="medallionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9C103A" flood-opacity="0.20" />
    </filter>

    <!-- Single Large Petal Definition -->
    <path id="mainPetal" d="M 256,256 C 200,165 200,68 256,48 C 312,68 312,165 256,256 Z" />
    <path id="innerPetal" d="M 256,256 C 218,175 218,98 256,80 C 294,98 294,175 256,256 Z" />
  </defs>

  <!-- Background Canvas with iOS Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />

  <!-- Blooming Flower Motif (Large & Prominent) -->
  <g filter="url(#flowerShadow)">
    <!-- 8 Main Outer Petals -->
    <g fill="url(#petalGrad)">
      <use href="#mainPetal" />
      <use href="#mainPetal" transform="rotate(45 256 256)" />
      <use href="#mainPetal" transform="rotate(90 256 256)" />
      <use href="#mainPetal" transform="rotate(135 256 256)" />
      <use href="#mainPetal" transform="rotate(180 256 256)" />
      <use href="#mainPetal" transform="rotate(225 256 256)" />
      <use href="#mainPetal" transform="rotate(270 256 256)" />
      <use href="#mainPetal" transform="rotate(315 256 256)" />
    </g>

    <!-- 8 Inner Highlight Petals -->
    <g fill="url(#petalLightGrad)" opacity="0.88">
      <use href="#innerPetal" transform="rotate(22.5 256 256)" />
      <use href="#innerPetal" transform="rotate(67.5 256 256)" />
      <use href="#innerPetal" transform="rotate(112.5 256 256)" />
      <use href="#innerPetal" transform="rotate(157.5 256 256)" />
      <use href="#innerPetal" transform="rotate(202.5 256 256)" />
      <use href="#innerPetal" transform="rotate(247.5 256 256)" />
      <use href="#innerPetal" transform="rotate(292.5 256 256)" />
      <use href="#innerPetal" transform="rotate(337.5 256 256)" />
    </g>
  </g>

  <!-- Central Coin Medallion -->
  <circle cx="256" cy="256" r="108" fill="url(#medallionGrad)" stroke="#FFAEC3" stroke-width="7" filter="url(#medallionShadow)" />
  <circle cx="256" cy="256" r="94" fill="none" stroke="#F67393" stroke-width="2.5" stroke-dasharray="6 7" opacity="0.8" />

  <!-- Bold & Crisp Euro Glyph in Center -->
  <text 
    x="256" 
    y="302" 
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Playfair Display', Georgia, serif" 
    font-size="132" 
    font-weight="800" 
    fill="#CF194F" 
    text-anchor="middle">€</text>

  <!-- Corner Sparkles -->
  <g fill="#EB4874">
    <!-- Top-Right Sparkle -->
    <path d="M 432 80 Q 432 95 447 95 Q 432 95 432 110 Q 432 95 417 95 Q 432 95 432 80 Z" />
    <circle cx="456" cy="72" r="5" fill="#FFAEC3" />

    <!-- Bottom-Left Sparkle -->
    <path d="M 80 432 Q 80 447 95 447 Q 80 447 80 462 Q 80 447 65 447 Q 80 447 80 432 Z" />
    <circle cx="56" cy="440" r="5" fill="#FFAEC3" />
  </g>
</svg>
